[build]
  publish = "web/dist"
  command = "node --test web/test/*.test.mjs web/dist/gles-host.test.mjs"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
