[build]
  publish = "web/dist"
  command = "node web/tools/stamp-sw.mjs && node --test web/test/*.test.mjs web/dist/gles-host.test.mjs"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/runtime-data.bin.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip"
